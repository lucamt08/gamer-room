<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Gamer Room</title>
    <!--
      Politique de sécurité (CSP) : l'interface ne peut charger que ses propres
      scripts. Les images peuvent venir du cache local (cover:) ou d'Internet
      (aperçus SteamGridDB).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: cover: https:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
